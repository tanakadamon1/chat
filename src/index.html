<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <section class="wrapper">
        <h1>chat</h1>
        <div class="roomList">
            <button onclick="joinRoom('room1')">Room1</button>
            <button onclick="joinRoom('room2')">Room2</button>
        </div>
        <div class="inputBox">
            <div class="inputBoxList">
                <input type="text" name="inputName" id="inputName" placeholder="名前">
                <input type="text" name="inputText" id="inputText" placeholder="内容">
            </div>
            <button id="sendBtn" class="sendBtn">送信</button>
        </div>
        <h2 id="roomName"></h2>
        <ul id="chatList" class="chatList">
        
        </ul>
    </section>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js" defer></script>
</body>
</html>
